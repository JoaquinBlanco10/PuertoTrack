name: puertotrack-integration-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: puertotrack_integration_test
      POSTGRES_USER: puertotrack_test
      POSTGRES_PASSWORD: puertotrack_test_local_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./postgres_integration/init-test-db.sql:/docker-entrypoint-initdb.d/10-marker.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puertotrack_test -d puertotrack_integration_test"]
      interval: 2s
      timeout: 3s
      retries: 20
